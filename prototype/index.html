<!doctype html>
<html lang="sq">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#1F3A5F">
  <title>Porositë · prototip</title>
  <!-- Night Mode before first paint: saved choice, else the device setting (no white flash) -->
  <script>
    (function () {
      var t = null;
      try { t = (JSON.parse(localStorage.getItem('ot-proto-prefs')) || {}).theme; } catch (e) {}
      if (t !== 'dark' && t !== 'light') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <!-- Inter from Google Fonts (prototype only; the app self-hosts it) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/tokens.css?v=10">
  <link rel="stylesheet" href="css/app.css?v=10">
</head>
<body>
  <!-- Prototype chrome (laptop only; on a phone use the avatar button in the app header).
       Filled by app.js: brand, "Shiko si" (Pronari / Zyra / Klienti), the demo moments, and a "Më shumë" panel. -->
  <div class="proto-bar" id="proto-bar"></div>

  <div class="stage">
    <div class="device device--phone" id="device">
      <div class="app" id="app">
        <div id="view"></div>
        <div id="sheet-root"></div>
        <div id="toast-root"></div>
      </div>
    </div>
  </div>

  <script src="js/brands.js?v=10"></script>
  <script src="js/logic.js?v=10"></script>
  <script src="js/data.js?v=10"></script>
  <script src="js/export.js?v=10"></script>
  <script src="js/app.js?v=10"></script>
</body>
</html>
